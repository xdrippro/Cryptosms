name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project (zip bo'lsa)
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            DIR="."
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::Repo ildizida na loyiha fayllari, na .zip topildi."
              exit 1
            fi
            echo "Unzip: $ZIP"
            rm -rf _unpacked && mkdir _unpacked
            unzip -q "$ZIP" -d _unpacked -x '__MACOSX/*'
            SETTINGS=$(find _unpacked -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::Zip ichida settings.gradle(.kts) topilmadi."
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
          fi
          echo "Loyiha papkasi: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --console=plain

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' "$PROJECT_DIR/app/build.gradle.kts")
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk" "$GITHUB_WORKSPACE/XYZet-Client-${VERSION}-unsigned.apk"
          echo "APK_NAME=XYZet-Client-${VERSION}-unsigned.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XYZet-Client-unsigned
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
