name: Build Crypto SMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: ZIP ni ochish
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Loyiha ildizda, ochish shart emas"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Repo ildizida .zip fayl topilmadi"
            exit 1
          fi
          echo "Ochilmoqda: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP ichida settings.gradle(.kts) topilmadi"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Loyiha papkasi: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Android SDK litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: APK yig'ish
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --console=plain --stacktrace

      - name: APK'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSms-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
